<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="980" viewBox="0 0 2500 980" role="img" aria-labelledby="title desc">
  <title id="title">OneX Hub clean left-to-right runtime flow</title>
  <desc id="desc">An associate opens OneX Hub. Hub validates the session and entitlement, resolves the selected application's Spool manifest, and the browser downloads the MFE and Thread assets from Cloud Storage. The MFE composes Thread components and renders the screen. Data requests pass through Bobbin, Apigee, and the domain backend.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2430" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c41230"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#236889"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #17191d; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #616873; }
      .phase { font: 700 13px Arial, sans-serif; letter-spacing: 2px; }
      .step { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .card-title { font: 700 22px Arial, sans-serif; fill: #17191d; }
      .card-subtitle { font: 700 14px Arial, sans-serif; fill: #525964; letter-spacing: .4px; }
      .body { font: 400 14px Arial, sans-serif; fill: #454c56; }
      .strong { font: 700 14px Arial, sans-serif; fill: #272c33; }
      .small { font: 400 12px Arial, sans-serif; fill: #666d77; }
      .arrow-label { font: 700 12px Arial, sans-serif; }
      .boundary { font: 700 12px Arial, sans-serif; fill: #525964; letter-spacing: 1.2px; }
      .footer { font: 400 14px Arial, sans-serif; fill: #555c66; }
    </style>
  </defs>

  <rect width="2500" height="980" fill="#f7f7f5"/>
  <rect width="2500" height="9" fill="#c41230"/>

  <text x="70" y="70" class="title">OneX Hub — Clean Left-to-Right Runtime Flow</text>
  <text x="70" y="104" class="subtitle">One launch path, one browser render path, one governed API path</text>

  <rect x="70" y="140" width="1280" height="42" rx="21" fill="#f4e1e5"/>
  <circle cx="92" cy="161" r="7" fill="#c41230"/>
  <text x="112" y="166" class="phase" fill="#9c1128">LAUNCH + UI DELIVERY</text>
  <text x="348" y="166" class="small">authenticate → select app → resolve manifest → download assets → render</text>

  <rect x="1370" y="140" width="1060" height="42" rx="21" fill="#e4f0f5"/>
  <circle cx="1392" cy="161" r="7" fill="#236889"/>
  <text x="1412" y="166" class="phase" fill="#1f5f7e">API + BUSINESS DATA</text>
  <text x="1621" y="166" class="small">authorize operation → gateway → backend</text>

  <!-- Card 1: Associate -->
  <g filter="url(#shadow)">
    <rect x="55" y="255" width="220" height="410" rx="18" fill="#ffffff" stroke="#d1d4d9"/>
  </g>
  <circle cx="85" cy="286" r="15" fill="#1f2329"/>
  <text x="85" y="291" text-anchor="middle" class="step">1</text>
  <circle cx="165" cy="358" r="34" fill="#f0f1f1" stroke="#c5c9ce"/>
  <circle cx="165" cy="348" r="11" fill="#24282e"/>
  <path d="M142 382C145 359 185 359 188 382" fill="#24282e"/>
  <rect x="112" y="408" width="106" height="70" rx="7" fill="#ffffff" stroke="#9fa5ad" stroke-width="2"/>
  <rect x="121" y="418" width="88" height="46" rx="3" fill="#f3f4f4"/>
  <line x1="148" y1="482" x2="182" y2="482" stroke="#9fa5ad" stroke-width="4" stroke-linecap="round"/>
  <text x="165" y="526" text-anchor="middle" class="card-title">Associate</text>
  <text x="165" y="554" text-anchor="middle" class="card-subtitle">BROWSER</text>
  <text x="165" y="590" text-anchor="middle" class="body">Opens OneX Hub</text>
  <text x="165" y="614" text-anchor="middle" class="body">Chooses an entitled app</text>

  <!-- Card 2: Hub -->
  <g filter="url(#shadow)">
    <rect x="315" y="225" width="300" height="470" rx="18" fill="#ffffff" stroke="#e1aab6" stroke-width="2"/>
  </g>
  <circle cx="347" cy="257" r="15" fill="#c41230"/>
  <text x="347" y="262" text-anchor="middle" class="step">2</text>
  <text x="465" y="276" text-anchor="middle" class="card-title">OneX Hub</text>
  <text x="465" y="304" text-anchor="middle" class="card-subtitle">SHARED SERVICE + SHELL</text>
  <rect x="338" y="334" width="254" height="128" rx="10" fill="#fff7f8" stroke="#ead1d7"/>
  <rect x="338" y="334" width="254" height="34" rx="10" fill="#f3dfe4"/>
  <rect x="338" y="355" width="254" height="13" fill="#f3dfe4"/>
  <text x="354" y="357" class="strong">Server/bootstrap</text>
  <circle cx="354" cy="391" r="4" fill="#c41230"/><text x="366" y="396" class="body">Auth + session integration</text>
  <circle cx="354" cy="419" r="4" fill="#c41230"/><text x="366" y="424" class="body">Entitlement + manifest filter</text>
  <circle cx="354" cy="447" r="4" fill="#c41230"/><text x="366" y="452" class="body">Secure bootstrap response</text>
  <rect x="338" y="480" width="254" height="132" rx="10" fill="#fff7f8" stroke="#ead1d7"/>
  <rect x="338" y="480" width="254" height="34" rx="10" fill="#f3dfe4"/>
  <rect x="338" y="501" width="254" height="13" fill="#f3dfe4"/>
  <text x="354" y="503" class="strong">Browser shell</text>
  <circle cx="354" cy="537" r="4" fill="#c41230"/><text x="366" y="542" class="body">Navigation + app launch</text>
  <circle cx="354" cy="565" r="4" fill="#c41230"/><text x="366" y="570" class="body">Loads and mounts the MFE</text>
  <circle cx="354" cy="593" r="4" fill="#c41230"/><text x="366" y="598" class="body">Owns the common frame</text>
  <text x="465" y="654" text-anchor="middle" class="small">The Hub does not contain app workflows</text>

  <!-- Card 3: Spool -->
  <g filter="url(#shadow)">
    <rect x="655" y="255" width="250" height="410" rx="18" fill="#ffffff" stroke="#b9bdc3"/>
  </g>
  <circle cx="685" cy="286" r="15" fill="#676d76"/>
  <text x="685" y="291" text-anchor="middle" class="step">3</text>
  <path d="M735 337H829L850 358V469H735Z" fill="#f5f5f4" stroke="#9da2aa" stroke-width="2"/>
  <path d="M829 337V358H850" fill="none" stroke="#9da2aa" stroke-width="2"/>
  <line x1="754" y1="383" x2="831" y2="383" stroke="#c41230" stroke-width="4" stroke-linecap="round"/>
  <line x1="754" y1="407" x2="831" y2="407" stroke="#adb2b9" stroke-width="3" stroke-linecap="round"/>
  <line x1="754" y1="431" x2="815" y2="431" stroke="#adb2b9" stroke-width="3" stroke-linecap="round"/>
  <text x="780" y="518" text-anchor="middle" class="card-title">Spool</text>
  <text x="780" y="546" text-anchor="middle" class="card-subtitle">APP MANIFEST</text>
  <text x="680" y="580" class="body">• route + entry URL</text>
  <text x="680" y="605" class="body">• capability + operations</text>
  <text x="680" y="630" class="body">• Thread versions</text>

  <!-- Card 4: Storage -->
  <g filter="url(#shadow)">
    <rect x="945" y="225" width="300" height="470" rx="18" fill="#ffffff" stroke="#9fc2d2" stroke-width="2"/>
  </g>
  <circle cx="977" cy="257" r="15" fill="#3f809d"/>
  <text x="977" y="262" text-anchor="middle" class="step">4</text>
  <text x="1095" y="276" text-anchor="middle" class="card-title">Cloud Storage + CDN</text>
  <text x="1095" y="304" text-anchor="middle" class="card-subtitle">VERSIONED STATIC DELIVERY</text>
  <ellipse cx="1095" cy="360" rx="91" ry="24" fill="#e7f1f5" stroke="#6f9eb3" stroke-width="2"/>
  <rect x="1004" y="360" width="182" height="105" fill="#e7f1f5" stroke="#6f9eb3" stroke-width="2"/>
  <ellipse cx="1095" cy="465" rx="91" ry="24" fill="#dbeaf0" stroke="#6f9eb3" stroke-width="2"/>
  <ellipse cx="1095" cy="360" rx="91" ry="24" fill="#f4f9fb" stroke="#6f9eb3" stroke-width="2"/>
  <rect x="1028" y="386" width="134" height="29" rx="6" fill="#ffffff" stroke="#bdd5df"/>
  <text x="1095" y="405" text-anchor="middle" class="strong">MFE bundles</text>
  <rect x="1028" y="423" width="134" height="29" rx="6" fill="#ffffff" stroke="#bdd5df"/>
  <text x="1095" y="442" text-anchor="middle" class="strong">Thread chunks</text>
  <text x="1095" y="524" text-anchor="middle" class="body">JavaScript · CSS · images</text>
  <text x="1095" y="550" text-anchor="middle" class="body">immutable, approved versions</text>
  <rect x="984" y="582" width="222" height="54" rx="9" fill="#f4f8fa" stroke="#d2e1e7"/>
  <text x="1095" y="605" text-anchor="middle" class="small">optional: approved Spool</text>
  <text x="1095" y="623" text-anchor="middle" class="small">snapshot, fetched by Hub</text>

  <!-- Card 5: Browser runtime -->
  <g filter="url(#shadow)">
    <rect x="1285" y="225" width="360" height="470" rx="18" fill="#ffffff" stroke="#e1aab6" stroke-width="2"/>
  </g>
  <circle cx="1317" cy="257" r="15" fill="#c41230"/>
  <text x="1317" y="262" text-anchor="middle" class="step">5</text>
  <text x="1465" y="276" text-anchor="middle" class="card-title">Browser Runtime</text>
  <text x="1465" y="304" text-anchor="middle" class="card-subtitle">SELECTED APP RENDERS HERE</text>
  <rect x="1315" y="334" width="300" height="210" rx="12" fill="#f5f5f4" stroke="#aeb3ba" stroke-width="2"/>
  <rect x="1315" y="334" width="300" height="36" rx="12" fill="#e7e7e5"/>
  <rect x="1315" y="358" width="300" height="12" fill="#e7e7e5"/>
  <circle cx="1335" cy="352" r="5" fill="#c41230"/>
  <circle cx="1352" cy="352" r="5" fill="#d5a33d"/>
  <circle cx="1369" cy="352" r="5" fill="#4d9a70"/>
  <rect x="1337" y="392" width="256" height="45" rx="7" fill="#ffffff" stroke="#d5d8dc"/>
  <text x="1352" y="419" class="strong">MFE: workflow + state</text>
  <line x1="1465" y1="444" x2="1465" y2="464" stroke="#c41230" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="1337" y="470" width="75" height="46" rx="7" fill="#fff7f8" stroke="#e1aab6"/>
  <rect x="1427" y="470" width="75" height="46" rx="7" fill="#fff7f8" stroke="#e1aab6"/>
  <rect x="1517" y="470" width="75" height="46" rx="7" fill="#fff7f8" stroke="#e1aab6"/>
  <text x="1375" y="489" text-anchor="middle" class="small">Thread</text><text x="1375" y="505" text-anchor="middle" class="strong">Form</text>
  <text x="1465" y="489" text-anchor="middle" class="small">Thread</text><text x="1465" y="505" text-anchor="middle" class="strong">Table</text>
  <text x="1555" y="489" text-anchor="middle" class="small">Thread</text><text x="1555" y="505" text-anchor="middle" class="strong">Panel</text>
  <text x="1465" y="586" text-anchor="middle" class="body">MFE composes Thread components</text>
  <text x="1465" y="612" text-anchor="middle" class="body">and renders the user experience</text>
  <rect x="1355" y="637" width="220" height="28" rx="14" fill="#f3dfe4"/>
  <text x="1465" y="656" text-anchor="middle" class="strong">No direct database access</text>

  <!-- Card 6: Bobbin -->
  <g filter="url(#shadow)">
    <rect x="1685" y="255" width="230" height="410" rx="18" fill="#ffffff" stroke="#bba8d3" stroke-width="2"/>
  </g>
  <circle cx="1715" cy="286" r="15" fill="#75519b"/>
  <text x="1715" y="291" text-anchor="middle" class="step">6</text>
  <rect x="1735" y="342" width="130" height="94" rx="12" fill="#f2edf7" stroke="#a78dbf" stroke-width="2"/>
  <rect x="1752" y="360" width="96" height="11" rx="5" fill="#75519b"/>
  <circle cx="1761" cy="397" r="6" fill="#a78dbf"/><line x1="1776" y1="397" x2="1836" y2="397" stroke="#a78dbf" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1761" cy="418" r="6" fill="#a78dbf"/><line x1="1776" y1="418" x2="1836" y2="418" stroke="#a78dbf" stroke-width="4" stroke-linecap="round"/>
  <text x="1800" y="482" text-anchor="middle" class="card-title">Bobbin</text>
  <text x="1800" y="510" text-anchor="middle" class="card-subtitle">SERVER RUNTIME / BFF</text>
  <text x="1710" y="548" class="body">• enforce capability</text>
  <text x="1710" y="574" class="body">• validate operation key</text>
  <text x="1710" y="600" class="body">• call typed adapter</text>
  <text x="1800" y="636" text-anchor="middle" class="small">Current POC boundary</text>

  <!-- Card 7: Apigee -->
  <g filter="url(#shadow)">
    <rect x="1955" y="285" width="190" height="350" rx="18" fill="#ffffff" stroke="#9fc2d2"/>
  </g>
  <circle cx="1985" cy="316" r="15" fill="#236889"/>
  <text x="1985" y="321" text-anchor="middle" class="step">7</text>
  <path d="M2004 366H2096V452H2004Z" fill="#e7f1f5" stroke="#6f9eb3" stroke-width="2"/>
  <path d="M2017 386H2083M2017 409H2083M2017 432H2083" stroke="#6f9eb3" stroke-width="3" stroke-linecap="round"/>
  <text x="2050" y="500" text-anchor="middle" class="card-title">Apigee</text>
  <text x="2050" y="528" text-anchor="middle" class="card-subtitle">API GATEWAY</text>
  <text x="2050" y="566" text-anchor="middle" class="body">Policy · routing</text>
  <text x="2050" y="590" text-anchor="middle" class="body">limits · telemetry</text>

  <!-- Card 8: backend -->
  <g filter="url(#shadow)">
    <rect x="2185" y="285" width="250" height="350" rx="18" fill="#ffffff" stroke="#afb4bb"/>
  </g>
  <circle cx="2215" cy="316" r="15" fill="#3e444d"/>
  <text x="2215" y="321" text-anchor="middle" class="step">8</text>
  <ellipse cx="2310" cy="378" rx="60" ry="16" fill="#ececea" stroke="#8f959d" stroke-width="2"/>
  <rect x="2250" y="378" width="120" height="61" fill="#ececea" stroke="#8f959d" stroke-width="2"/>
  <ellipse cx="2310" cy="439" rx="60" ry="16" fill="#dededc" stroke="#8f959d" stroke-width="2"/>
  <ellipse cx="2310" cy="378" rx="60" ry="16" fill="#f6f6f5" stroke="#8f959d" stroke-width="2"/>
  <path d="M2253 407C2284 420 2336 420 2367 407" fill="none" stroke="#a6abb2" stroke-width="2"/>
  <text x="2310" y="500" text-anchor="middle" class="card-title">Domain Backend</text>
  <text x="2310" y="528" text-anchor="middle" class="card-subtitle">SOURCE OF TRUTH</text>
  <text x="2310" y="566" text-anchor="middle" class="body">Authorization decisions</text>
  <text x="2310" y="590" text-anchor="middle" class="body">business rules + data</text>

  <!-- Straight connectors -->
  <line x1="275" y1="460" x2="305" y2="460" stroke="#c41230" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="290" y="442" text-anchor="middle" class="arrow-label" fill="#a40f28">open</text>

  <line x1="615" y1="460" x2="645" y2="460" stroke="#c41230" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="630" y="437" text-anchor="middle" class="arrow-label" fill="#a40f28">resolve</text>

  <line x1="905" y1="460" x2="935" y2="460" stroke="#c41230" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="920" y="437" text-anchor="middle" class="arrow-label" fill="#a40f28">URLs</text>

  <line x1="1245" y1="460" x2="1275" y2="460" stroke="#c41230" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="1260" y="437" text-anchor="middle" class="arrow-label" fill="#a40f28">load</text>

  <line x1="1645" y1="460" x2="1675" y2="460" stroke="#236889" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1660" y="433" text-anchor="middle" class="arrow-label" fill="#1f5f7e">API</text>

  <line x1="1915" y1="460" x2="1945" y2="460" stroke="#236889" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1930" y="437" text-anchor="middle" class="arrow-label" fill="#1f5f7e">route</text>

  <line x1="2145" y1="460" x2="2175" y2="460" stroke="#236889" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="2160" y="437" text-anchor="middle" class="arrow-label" fill="#1f5f7e">request</text>

  <!-- Execution boundary line -->
  <line x1="55" y1="730" x2="2435" y2="730" stroke="#c8cbd0" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="55" y="718" class="boundary">BROWSER + PLATFORM EXPERIENCE</text>
  <text x="1685" y="718" class="boundary">SERVER API PATH</text>

  <rect x="55" y="918" width="2380" height="1" fill="#d1d4d8"/>
  <circle cx="70" cy="947" r="5" fill="#c41230"/>
  <text x="86" y="952" class="footer">Hub validates access and controls launch</text>
  <circle cx="485" cy="947" r="5" fill="#c41230"/>
  <text x="501" y="952" class="footer">MFE + Thread execute in the browser</text>
  <circle cx="961" cy="947" r="5" fill="#236889"/>
  <text x="977" y="952" class="footer">Bobbin + Apigee protect the API path</text>
  <circle cx="1503" cy="947" r="5" fill="#3e444d"/>
  <text x="1519" y="952" class="footer">The backend remains the source of truth</text>
</svg>
