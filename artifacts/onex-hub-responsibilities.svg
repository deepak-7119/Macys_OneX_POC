<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220" role="img" aria-labelledby="title desc">
  <title id="title">OneX Hub responsibility boundaries</title>
  <desc id="desc">Six responsibility cards explain what OneX Hub, Spool, MFE, Thread, Cloud Storage and Bobbin own and do not own. Browser, configuration, static delivery and server execution boundaries are shown.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17202b" flood-opacity="0.09"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #17191d; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #626872; }
      .band { font: 700 12px Arial, sans-serif; letter-spacing: 1.6px; }
      .card-title { font: 700 24px Arial, sans-serif; fill: #17191d; }
      .role { font: 700 13px Arial, sans-serif; fill: #626872; letter-spacing: 1px; }
      .label { font: 700 12px Arial, sans-serif; letter-spacing: 1.2px; }
      .body { font: 400 15px Arial, sans-serif; fill: #3f464f; }
      .body-strong { font: 700 15px Arial, sans-serif; fill: #292e35; }
      .not { font: 400 14px Arial, sans-serif; fill: #666d76; }
      .footer-title { font: 700 15px Arial, sans-serif; fill: #20242a; }
      .footer { font: 400 14px Arial, sans-serif; fill: #555c65; }
    </style>
  </defs>

  <rect width="1900" height="1220" fill="#f7f7f5"/>
  <rect width="1900" height="9" fill="#c41230"/>
  <text x="55" y="68" class="title">OneX Hub — Responsibility Boundaries</text>
  <text x="55" y="101" class="subtitle">Each layer has one clear job; reuse does not move application logic or backend ownership into the shared platform</text>

  <!-- Execution bands -->
  <rect x="55" y="133" width="1168" height="42" rx="21" fill="#f3dfe4"/>
  <text x="77" y="159" class="band" fill="#9f1229">BROWSER EXPERIENCE</text>
  <text x="253" y="159" class="not">Hub shell · MFE · Thread</text>
  <rect x="1241" y="133" width="294" height="42" rx="21" fill="#ececea"/>
  <text x="1263" y="159" class="band" fill="#565c64">CONFIGURATION</text>
  <text x="1396" y="159" class="not">Spool</text>
  <rect x="1553" y="133" width="292" height="42" rx="21" fill="#e4f0f5"/>
  <text x="1575" y="159" class="band" fill="#1f5f7e">SERVER RUNTIME</text>
  <text x="1712" y="159" class="not">Bobbin</text>

  <!-- Hub card -->
  <g filter="url(#shadow)"><rect x="55" y="205" width="570" height="405" rx="18" fill="#ffffff" stroke="#dfacb7" stroke-width="2"/></g>
  <rect x="55" y="205" width="570" height="9" rx="5" fill="#c41230"/>
  <circle cx="105" cy="267" r="26" fill="#f3dfe4"/>
  <path d="M91 265H119M95 255H115M95 275H115" stroke="#c41230" stroke-width="3" stroke-linecap="round"/>
  <circle cx="91" cy="265" r="4" fill="#c41230"/><circle cx="119" cy="265" r="4" fill="#c41230"/>
  <text x="148" y="261" class="card-title">OneX Hub</text>
  <text x="148" y="286" class="role">SHARED PRODUCT EXPERIENCE</text>
  <text x="85" y="333" class="label" fill="#a30f28">OWNS</text>
  <circle cx="91" cy="368" r="5" fill="#c41230"/><text x="107" y="373" class="body">Auth integration and session coordination</text>
  <circle cx="91" cy="403" r="5" fill="#c41230"/><text x="107" y="408" class="body">App entitlement, navigation and common shell</text>
  <circle cx="91" cy="438" r="5" fill="#c41230"/><text x="107" y="443" class="body">Manifest filtering and selected MFE mounting</text>
  <circle cx="91" cy="473" r="5" fill="#c41230"/><text x="107" y="478" class="body">Shared launch, error and sign-out experience</text>
  <line x1="85" y1="512" x2="595" y2="512" stroke="#e1e3e6"/>
  <text x="85" y="543" class="label" fill="#666d76">DOES NOT OWN</text>
  <text x="85" y="574" class="not">Application workflows, domain rules or business data</text>

  <!-- Spool card -->
  <g filter="url(#shadow)"><rect x="665" y="205" width="570" height="405" rx="18" fill="#ffffff" stroke="#b8bdc4" stroke-width="2"/></g>
  <rect x="665" y="205" width="570" height="9" rx="5" fill="#676d76"/>
  <circle cx="715" cy="267" r="26" fill="#eeeeec"/>
  <path d="M703 250H722L730 258V284H703Z" fill="#ffffff" stroke="#676d76" stroke-width="2"/>
  <path d="M722 250V258H730" fill="none" stroke="#676d76" stroke-width="2"/>
  <line x1="708" y1="267" x2="724" y2="267" stroke="#c41230" stroke-width="2"/>
  <line x1="708" y1="274" x2="724" y2="274" stroke="#9aa0a7" stroke-width="2"/>
  <text x="758" y="261" class="card-title">Spool</text>
  <text x="758" y="286" class="role">DECLARATIVE APPLICATION CONTRACT</text>
  <text x="695" y="333" class="label" fill="#555b64">OWNS</text>
  <circle cx="701" cy="368" r="5" fill="#676d76"/><text x="717" y="373" class="body">Application route and versioned entry bundle URL</text>
  <circle cx="701" cy="403" r="5" fill="#676d76"/><text x="717" y="408" class="body">Capability and allowed operation keys</text>
  <circle cx="701" cy="438" r="5" fill="#676d76"/><text x="717" y="443" class="body">Thread references and compatible versions</text>
  <circle cx="701" cy="473" r="5" fill="#676d76"/><text x="717" y="478" class="body">Auditable application release configuration</text>
  <line x1="695" y1="512" x2="1205" y2="512" stroke="#e1e3e6"/>
  <text x="695" y="543" class="label" fill="#666d76">DOES NOT OWN</text>
  <text x="695" y="574" class="not">Rendering, API execution, sessions or business logic</text>

  <!-- MFE card -->
  <g filter="url(#shadow)"><rect x="1275" y="205" width="570" height="405" rx="18" fill="#ffffff" stroke="#9ec0d0" stroke-width="2"/></g>
  <rect x="1275" y="205" width="570" height="9" rx="5" fill="#236889"/>
  <circle cx="1325" cy="267" r="26" fill="#e4f0f5"/>
  <rect x="1310" y="254" width="30" height="25" rx="3" fill="#ffffff" stroke="#236889" stroke-width="2"/>
  <line x1="1310" y1="261" x2="1340" y2="261" stroke="#236889" stroke-width="2"/>
  <rect x="1315" y="266" width="8" height="8" rx="1" fill="#236889"/><line x1="1327" y1="268" x2="1335" y2="268" stroke="#8ab1c2" stroke-width="2"/><line x1="1327" y1="273" x2="1335" y2="273" stroke="#8ab1c2" stroke-width="2"/>
  <text x="1368" y="261" class="card-title">MFE</text>
  <text x="1368" y="286" class="role">APPLICATION FRONTEND LOGIC</text>
  <text x="1305" y="333" class="label" fill="#1f5f7e">OWNS</text>
  <circle cx="1311" cy="368" r="5" fill="#236889"/><text x="1327" y="373" class="body">Screen workflow, browser state and navigation</text>
  <circle cx="1311" cy="403" r="5" fill="#236889"/><text x="1327" y="408" class="body">API orchestration using approved operation keys</text>
  <circle cx="1311" cy="438" r="5" fill="#236889"/><text x="1327" y="443" class="body">Composing Thread and app-specific components</text>
  <circle cx="1311" cy="473" r="5" fill="#236889"/><text x="1327" y="478" class="body">Loading, validation and recoverable UI errors</text>
  <line x1="1305" y1="512" x2="1815" y2="512" stroke="#e1e3e6"/>
  <text x="1305" y="543" class="label" fill="#666d76">DOES NOT OWN</text>
  <text x="1305" y="574" class="not">Authoritative authorization, domain rules or database</text>

  <!-- Thread card -->
  <g filter="url(#shadow)"><rect x="55" y="650" width="570" height="405" rx="18" fill="#ffffff" stroke="#d3b574" stroke-width="2"/></g>
  <rect x="55" y="650" width="570" height="9" rx="5" fill="#b67b21"/>
  <circle cx="105" cy="712" r="26" fill="#f7edd9"/>
  <rect x="91" y="698" width="12" height="12" rx="2" fill="#ffffff" stroke="#b67b21" stroke-width="2"/><rect x="107" y="698" width="12" height="12" rx="2" fill="#ffffff" stroke="#b67b21" stroke-width="2"/><rect x="91" y="714" width="12" height="12" rx="2" fill="#ffffff" stroke="#b67b21" stroke-width="2"/><rect x="107" y="714" width="12" height="12" rx="2" fill="#b67b21"/>
  <text x="148" y="706" class="card-title">Thread</text>
  <text x="148" y="731" class="role">REUSABLE UI SYSTEM</text>
  <text x="85" y="778" class="label" fill="#9a6516">OWNS</text>
  <circle cx="91" cy="813" r="5" fill="#b67b21"/><text x="107" y="818" class="body">Reusable components such as Form, Table and Panel</text>
  <circle cx="91" cy="848" r="5" fill="#b67b21"/><text x="107" y="853" class="body">Design tokens, CSS and interaction consistency</text>
  <circle cx="91" cy="883" r="5" fill="#b67b21"/><text x="107" y="888" class="body">Accessibility behavior and component contracts</text>
  <circle cx="91" cy="918" r="5" fill="#b67b21"/><text x="107" y="923" class="body">Versioned, tested UI building blocks</text>
  <line x1="85" y1="957" x2="595" y2="957" stroke="#e1e3e6"/>
  <text x="85" y="988" class="label" fill="#666d76">DOES NOT OWN</text>
  <text x="85" y="1019" class="not">App workflow, API routing, business data or rendering service</text>

  <!-- Cloud storage card -->
  <g filter="url(#shadow)"><rect x="665" y="650" width="570" height="405" rx="18" fill="#ffffff" stroke="#9ec0d0" stroke-width="2"/></g>
  <rect x="665" y="650" width="570" height="9" rx="5" fill="#3f809d"/>
  <circle cx="715" cy="712" r="26" fill="#e4f0f5"/>
  <ellipse cx="715" cy="703" rx="16" ry="6" fill="#ffffff" stroke="#3f809d" stroke-width="2"/>
  <rect x="699" y="703" width="32" height="18" fill="#ffffff" stroke="#3f809d" stroke-width="2"/>
  <ellipse cx="715" cy="721" rx="16" ry="6" fill="#e4f0f5" stroke="#3f809d" stroke-width="2"/>
  <text x="758" y="706" class="card-title">Cloud Storage / S3 + CDN</text>
  <text x="758" y="731" class="role">STATIC ARTIFACT DISTRIBUTION</text>
  <text x="695" y="778" class="label" fill="#1f5f7e">OWNS</text>
  <circle cx="701" cy="813" r="5" fill="#3f809d"/><text x="717" y="818" class="body">Immutable, versioned MFE JavaScript and CSS</text>
  <circle cx="701" cy="848" r="5" fill="#3f809d"/><text x="717" y="853" class="body">Thread chunks, tokens, images and other assets</text>
  <circle cx="701" cy="883" r="5" fill="#3f809d"/><text x="717" y="888" class="body">CDN delivery, cache policy and artifact retention</text>
  <circle cx="701" cy="918" r="5" fill="#3f809d"/><text x="717" y="923" class="body">Optional approved Spool publication snapshot</text>
  <line x1="695" y1="957" x2="1205" y2="957" stroke="#e1e3e6"/>
  <text x="695" y="988" class="label" fill="#666d76">DOES NOT OWN</text>
  <text x="695" y="1019" class="not">Authentication, sessions, API processing or business data</text>

  <!-- Bobbin card -->
  <g filter="url(#shadow)"><rect x="1275" y="650" width="570" height="405" rx="18" fill="#ffffff" stroke="#b7a3d0" stroke-width="2"/></g>
  <rect x="1275" y="650" width="570" height="9" rx="5" fill="#75519b"/>
  <circle cx="1325" cy="712" r="26" fill="#f0eaf6"/>
  <rect x="1310" y="697" width="30" height="30" rx="6" fill="#ffffff" stroke="#75519b" stroke-width="2"/>
  <line x1="1316" y1="706" x2="1334" y2="706" stroke="#75519b" stroke-width="3" stroke-linecap="round"/><circle cx="1318" cy="717" r="3" fill="#a58abc"/><line x1="1325" y1="717" x2="1334" y2="717" stroke="#a58abc" stroke-width="3" stroke-linecap="round"/>
  <text x="1368" y="706" class="card-title">Bobbin</text>
  <text x="1368" y="731" class="role">SERVER RUNTIME / BFF BOUNDARY</text>
  <text x="1305" y="778" class="label" fill="#67448d">OWNS IN THE CURRENT POC</text>
  <circle cx="1311" cy="813" r="5" fill="#75519b"/><text x="1327" y="818" class="body">Hub hosting, secure bootstrap and session enforcement</text>
  <circle cx="1311" cy="848" r="5" fill="#75519b"/><text x="1327" y="853" class="body">Capability and operation-key validation</text>
  <circle cx="1311" cy="883" r="5" fill="#75519b"/><text x="1327" y="888" class="body">Typed API adapters and controlled backend proxying</text>
  <circle cx="1311" cy="918" r="5" fill="#75519b"/><text x="1327" y="923" class="body">Common logging, tracing and error normalization</text>
  <line x1="1305" y1="957" x2="1815" y2="957" stroke="#e1e3e6"/>
  <text x="1305" y="988" class="label" fill="#666d76">DOES NOT OWN</text>
  <text x="1305" y="1019" class="not">Frontend rendering or permanent domain business rules</text>

  <!-- Ownership summary -->
  <rect x="55" y="1090" width="1790" height="86" rx="14" fill="#ffffff" stroke="#d0d3d7"/>
  <text x="85" y="1123" class="footer-title">Simple ownership rule</text>
  <circle cx="250" cy="1119" r="5" fill="#c41230"/><text x="266" y="1124" class="footer">Hub launches</text>
  <circle cx="402" cy="1119" r="5" fill="#676d76"/><text x="418" y="1124" class="footer">Spool describes</text>
  <circle cx="591" cy="1119" r="5" fill="#236889"/><text x="607" y="1124" class="footer">MFE orchestrates</text>
  <circle cx="812" cy="1119" r="5" fill="#b67b21"/><text x="828" y="1124" class="footer">Thread presents</text>
  <circle cx="1006" cy="1119" r="5" fill="#3f809d"/><text x="1022" y="1124" class="footer">Storage distributes</text>
  <circle cx="1240" cy="1119" r="5" fill="#75519b"/><text x="1256" y="1124" class="footer">Bobbin protects and connects</text>
  <text x="85" y="1155" class="footer">The domain backend remains the source of truth for authorization decisions, business rules and persistent data.</text>
</svg>
